<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#11131a" />
  <title>융합 로그라이크</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-mark">F</div>
        <div>
          <h1>융합 로그라이크</h1>
          <p>스토리 없는 전투 프로토타입</p>
        </div>
      </div>
      <button id="resetBtn" class="icon-btn" aria-label="새 게임">↻</button>
    </header>

    <main id="gameRoot" class="game-root">
      <section class="run-panel panel">
        <div class="run-row">
          <div class="run-stat"><span>ACT</span><strong id="actLabel">1</strong></div>
          <div class="run-stat"><span>STAGE</span><strong id="stageLabel">1/6</strong></div>
          <div class="run-stat"><span>GOLD</span><strong id="goldLabel">0</strong></div>
        </div>

        <div class="hp-head">
          <span>HP</span>
          <strong id="hpText">100 / 100</strong>
        </div>
        <div class="bar hp-bar"><div id="hpFill" class="bar-fill"></div></div>
        <div class="sub-stats">
          <span>🛡️ <b id="shieldText">0</b></span>
          <span>⚔️ <b id="attackText">12</b></span>
          <span>🎯 <b id="critText">5%</b></span>
          <span>🌀 <b id="fusionCountText">0</b></span>
        </div>
      </section>

      <section id="battleScreen" class="screen active">
        <section class="enemy-card panel">
          <div class="enemy-topline">
            <span id="enemyType" class="eyebrow">일반 적</span>
            <span id="turnLabel" class="turn-chip">TURN 1</span>
          </div>
          <div id="enemyAvatar" class="enemy-avatar">👹</div>
          <h2 id="enemyName">훈련용 골렘</h2>
          <div class="bar enemy-hp-bar"><div id="enemyHpFill" class="bar-fill"></div></div>
          <div id="enemyHpText" class="enemy-hp-text">60 / 60</div>

          <div class="intent-box">
            <div>
              <span class="intent-label">다음 행동</span>
              <strong id="enemyIntentName">강타</strong>
            </div>
            <div id="enemyIntentValue" class="intent-value">18 피해</div>
          </div>

          <div id="enemyStatuses" class="status-strip"></div>
        </section>

        <section class="combat-log panel">
          <div class="section-title-row">
            <h3>전투 로그</h3>
            <span id="comboText">연격 0</span>
          </div>
          <div id="logText" class="log-text">적의 행동을 확인하고 기술을 선택해.</div>
        </section>

        <section class="actions-grid" id="actionsGrid">
          <button class="action-card primary" data-action="attack">
            <span class="action-icon">⚔️</span>
            <span class="action-copy"><b>공격</b><small>기본 피해를 준다</small></span>
          </button>
          <button class="action-card" data-action="guard">
            <span class="action-icon">🛡️</span>
            <span class="action-copy"><b>수비</b><small>역장을 얻는다</small></span>
          </button>
          <button class="action-card" data-action="precision">
            <span class="action-icon">🎯</span>
            <span class="action-copy"><b>신중한 일격</b><small>치명타 확률 증가</small></span>
          </button>
          <button class="action-card" data-action="rush">
            <span class="action-icon">💨</span>
            <span class="action-copy"><b>초신속</b><small id="rushHint">2연타 · 재사용 2턴</small></span>
          </button>
        </section>
      </section>

      <section id="rewardScreen" class="screen">
        <section class="reward-head panel">
          <span class="eyebrow">BATTLE CLEAR</span>
          <h2>보상 하나를 선택해</h2>
          <p>장비마다 능력치와 기본 효과 레벨이 붙어 있어. 조합 조건을 만족하면 융합이 자동으로 활성화돼.</p>
        </section>
        <div id="rewardGrid" class="reward-grid"></div>
        <button id="rerollBtn" class="reroll-btn">🎲 새로고침 <span>25G</span></button>
      </section>

      <section id="gameOverScreen" class="screen">
        <section class="game-over panel">
          <div class="game-over-icon">☠️</div>
          <span class="eyebrow">RUN OVER</span>
          <h2>전투 종료</h2>
          <div class="result-grid">
            <div><span>도달</span><strong id="resultStage">Act 1 - 1/6</strong></div>
            <div><span>융합</span><strong id="resultFusion">0</strong></div>
            <div><span>궁극</span><strong id="resultUltimate">0</strong></div>
          </div>
          <button id="restartBtn" class="big-btn">다시 시작하기</button>
        </section>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="게임 메뉴">
      <button class="nav-btn active" data-view="battle"><span>⚔️</span><b>전투</b></button>
      <button class="nav-btn" data-view="effects"><span>✨</span><b>효과</b></button>
      <button class="nav-btn" data-view="fusions"><span>🧬</span><b>융합</b></button>
      <button class="nav-btn" data-view="help"><span>?</span><b>규칙</b></button>
    </nav>
  </div>

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div>
          <span id="modalEyebrow" class="eyebrow">INFO</span>
          <h2 id="modalTitle">정보</h2>
        </div>
        <button id="closeModalBtn" class="icon-btn">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="game.js"></script>
</body>
</html>
